{{ define "index" }}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>goshort</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            color: green;
            word-break: break-word;
        }
    </style>
</head>
<body>
<h1>Shorten your URL</h1>

<form method="POST" action="/shorten">
    <input type="text" name="url" placeholder="Enter your URL here..." required />
    <button type="submit">Shorten</button>
</form>

{{ if .ShortURL }}
<div id="result">
    <a href="{{ .ShortURL }}" target="_blank">{{ .ShortURL }}</a>
</div>
{{ end }}

</body>
</html>
{{ end }}
